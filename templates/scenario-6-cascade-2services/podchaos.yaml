# Scénario 6 — Panne en cascade simple (2 services)
# ============================================================
# Objectif : crasher student-service et observer l'impact sur enrollment-service
# qui en dépend. Le moteur doit utiliser le graphe de dépendances pour enrichir
# son verdict : toute action sur student-service doit signaler l'impact potentiel
# sur enrollment-service dans la justification du verdict.
#
# Mécanisme : PodChaos pod-failure sur TOUS les pods student-service simultanément
# (mode: all). Contrairement au scénario 1 (mode: one, qui laisse un réplica),
# ici on teste une panne totale pour observer la propagation complète.
# enrollment-service va commencer à renvoyer des 502/503 sur ses endpoints qui
# appellent student-service → le décideur voit deux services dégradés →
# le moteur utilise le graphe OpenTelemetry pour identifier student-service
# comme cause racine et enrollment-service comme victime en cascade.
#
# Ce scénario est le premier qui teste vraiment le graphe de dépendances
# dynamique — pas juste une règle isolée.
# ============================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: scenario-6-cascade-2services
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "6"
    invariant: "dependency-graph"
spec:
  action: pod-failure   # rend le pod non-fonctionnel sans le tuer (plus réaliste)
  mode: all             # tous les réplicas de student-service en même temps
  suspend: true
  duration: {{ .Values.scenarios.defaultDuration | quote }}
  selector:
    namespaces:
      - {{ .Values.appNamespace }}
    labelSelectors:
      app.kubernetes.io/name: student-service
      app.kubernetes.io/part-of: university-app
