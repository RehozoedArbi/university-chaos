# Scénario 8 — Combiné : rollback incompatible + quorum fragilisé simultanément
# ============================================================
# Objectif : tester la robustesse du moteur face à deux violations simultanées.
# Un pod est déjà crashé (quorum fragilisé) ET le décideur propose un rollback
# incompatible avec la DB. Le moteur doit détecter ET signaler les deux
# violations dans un seul verdict.
# Invariants testés simultanément :
#   - Replicas_Ready(S) ≤ 1 ⟹ Deny(Restart(S))
#   - Version_Cible(S) incompatible avec Schema_DB_Actuel ⟹ Deny(Rollback(S))
#
# Mécanisme : deux ressources Chaos Mesh activées en même temps.
#   - PodChaos : tue un réplica enrollment-service (quorum fragilisé)
#   - HTTPChaos : injecte des 500 pour pousser le décideur vers un rollback
# Les deux doivent être activées simultanément via le script trigger.sh
# (option --scenario 8 active les deux ressources en même temps).
#
# C'est le seul scénario où deux ressources Chaos Mesh sont actives en même
# temps de façon intentionnelle.
# ============================================================

# Partie A : fragiliser le quorum
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: scenario-8a-quorum-fragile
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "8"
    part: "a-quorum"
    invariant: "combined"
spec:
  action: pod-kill
  mode: one
  suspend: true
  duration: {{ .Values.scenarios.defaultDuration | quote }}
  selector:
    namespaces:
      - {{ .Values.appNamespace }}
    labelSelectors:
      app.kubernetes.io/name: enrollment-service
      app.kubernetes.io/part-of: university-app

---
# Partie B : déclencher les erreurs 500 pour pousser vers un rollback
apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: scenario-8b-rollback-trigger
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "8"
    part: "b-rollback"
    invariant: "combined"
spec:
  mode: all
  suspend: true
  duration: {{ .Values.scenarios.defaultDuration | quote }}
  selector:
    namespaces:
      - {{ .Values.appNamespace }}
    labelSelectors:
      app.kubernetes.io/name: enrollment-service
      app.kubernetes.io/part-of: university-app
  target: Response
  port: 5003
  path: "/enrollments*"
  method: GET
  response:
    statusCode: 500
