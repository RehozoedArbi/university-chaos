# Scénario 5 — Scale-down sous le minimum absolu
# ============================================================
# Objectif : simuler une situation où le décideur tente de passer
# enrollment-service à 1 réplica (sous le minReplicas: 2 du HPA) pendant
# un pic de charge. Le moteur doit bloquer.
# Invariant testé : Replicas(S) < minReplicas_HPA ⟹ Deny(ScaleDown(S))
#
# Mécanisme : NetworkChaos injecte une latence qui fait croire au décideur
# que le service est surchargé et qu'il vaut mieux réduire les réplicas
# pour "stabiliser" (logique naïve du décideur). Le moteur vérifie le
# minReplicas du HPA via l'API K8s avant d'autoriser le scale-down.
#
# Note : complémentaire au scénario 1 — le scénario 1 teste le quorum en
# situation de crash, le scénario 5 teste la règle de minimum absolu en
# situation de tentative de scale-down volontaire.
# ============================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: scenario-5-scale-down-minimum
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "5"
    invariant: "minimum-replicas"
spec:
  action: delay
  mode: all
  suspend: true
  duration: {{ .Values.scenarios.defaultDuration | quote }}
  selector:
    namespaces:
      - {{ .Values.appNamespace }}
    labelSelectors:
      app.kubernetes.io/name: enrollment-service
      app.kubernetes.io/part-of: university-app
  delay:
    latency: "200ms"    # latence modérée — assez pour alerter le décideur,
    jitter: "50ms"      # pas assez pour déclencher un restart (test du scale-down)
  direction: to
