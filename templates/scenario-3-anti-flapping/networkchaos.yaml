# Scénario 3 — Anti-flapping
# ============================================================
# Objectif : provoquer deux restarts successifs rapides sur student-service
# pour déclencher la règle anti-flapping.
# Le moteur doit bloquer le 2ème restart : Action_Contraire(S) exécutée
# il y a < délai_stabilisation ⟹ Deny(Action(S))
#
# Mécanisme : NetworkChaos injecte de la latence sur student-service, ce qui
# fait dépasser les timeouts et pousse le décideur à proposer un restart.
# Le décideur va voir les latences revenues (la latence injectée oscille),
# proposer un nouveau restart avant que le délai de stabilisation ne soit
# écoulé → le moteur bloque le 2ème restart.
#
# Note : ce scénario nécessite que ton décideur logge chaque action exécutée
# avec un timestamp — le moteur consulte ce log pour détecter le flapping.
# ============================================================
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: scenario-3-anti-flapping-latency
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: university-chaos
    scenario: "3"
    invariant: "anti-flapping"
spec:
  action: delay
  mode: all
  suspend: true
  duration: {{ .Values.scenarios.defaultDuration | quote }}
  selector:
    namespaces:
      - {{ .Values.appNamespace }}
    labelSelectors:
      app.kubernetes.io/name: student-service
      app.kubernetes.io/part-of: university-app
  delay:
    latency: {{ .Values.scenarios.networkLatencyMs }}ms
    correlation: "50"   # latence variable (pas fixe) pour simuler une instabilité
    jitter: "100ms"
  direction: to         # latence sur les requêtes entrantes vers student-service
